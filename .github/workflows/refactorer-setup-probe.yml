# Deploy for the authorized secret test on a scoped diagnostic tag at the
# registered .github/workflows/refactorer-setup-probe.yml path. Preserve main.
name: Refactorer credential probe
run-name: Refactorer credential probe ${{ inputs.probe_id }}

on:
  workflow_dispatch:
    inputs:
      probe_id:
        description: SETUP-CREDENTIALS identifier, outside measured timing slots
        required: true
        type: string
      reference_revision:
        description: Frozen timing-repository main revision
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: goal30-credential-probe
  cancel-in-progress: false

jobs:
  credentials:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      PROBE_ID: ${{ inputs.probe_id }}
      REFERENCE_REVISION: ${{ inputs.reference_revision }}
      REFACTORER_REVISION: 7e9f667a7ff06e090b890ed293f90ab23d18c6c8
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Verify diagnostic scope and secret presence
        env:
          CHECKOUT_SECRET: ${{ secrets.REFACTORER_REPOSITORY_TOKEN }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          if os.environ['GITHUB_REPOSITORY'] != 'jbpextra/Refactorer-timing-experiment':
              raise SystemExit('Wrong diagnostic repository')
          if os.environ['REFERENCE_REVISION'] != 'd51786492a5ffcf3a91bfa5bde996043202f2bb3':
              raise SystemExit('Wrong frozen baseline')
          if not re.fullmatch(r'SETUP-CREDENTIALS-[A-Za-z0-9-]+', os.environ['PROBE_ID']):
              raise SystemExit('Not a credential-only setup identifier')
          pathlib.Path(os.environ['RUNNER_TEMP'], 'credential-probe-evidence').mkdir(exist_ok=True)
          if not os.environ.get('CHECKOUT_SECRET'):
              raise SystemExit('Refactorer checkout secret is missing')
          PY

      - name: Check OpenAI authentication and model visibility
        id: openai
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          python3 - <<'PY'
          from datetime import datetime, timezone
          import json, os, pathlib, urllib.error, urllib.request
          evidence = pathlib.Path(os.environ['RUNNER_TEMP'], 'credential-probe-evidence')
          evidence.mkdir(exist_ok=True)
          result = {'kind': 'openai-credential-read-probe', 'model_requested': 'gpt-5.6-luna',
                    'method': 'GET', 'status': 'unavailable', 'http_status': None,
                    'generation_requests': 0, 'retries': 0,
                    'started_at_utc': datetime.now(timezone.utc).isoformat()}
          key = os.environ.get('OPENAI_API_KEY', '')
          try:
              if not key:
                  result['status'] = 'secret-missing'
              else:
                  request = urllib.request.Request('https://api.openai.com/v1/models/gpt-5.6-luna',
                      headers={'Authorization': 'Bearer ' + key}, method='GET')
                  class NoRedirect(urllib.request.HTTPRedirectHandler):
                      def redirect_request(self, request, fp, code, msg, headers, url):
                          return None
                  opener = urllib.request.build_opener(NoRedirect)
                  with opener.open(request, timeout=15) as response:
                      result['http_status'] = response.status
                      data = json.loads(response.read(65537))
                      result['status'] = 'authenticated-model-visible' if (
                          response.status == 200 and isinstance(data, dict)
                          and data.get('object') == 'model' and isinstance(data.get('id'), str)
                          and data['id']) else 'unexpected-model-response'
          except urllib.error.HTTPError as error:
              result.update(status='http-error', http_status=error.code)
          except Exception:
              # Exception messages/response bodies/headers can contain sensitive data.
              result['status'] = 'request-or-response-error'
          result['finished_at_utc'] = datetime.now(timezone.utc).isoformat()
          (evidence / 'openai.json').write_text(json.dumps(result, indent=2) + '\n')
          print('OpenAI credential check:', result['status'], 'HTTP:', result['http_status'])
          raise SystemExit(0 if result['status'] == 'authenticated-model-visible' else 1)
          PY

      - name: Checkout pinned private Refactorer source
        id: checkout
        continue-on-error: true
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: jbpextra/Refactorer
          ref: 7e9f667a7ff06e090b890ed293f90ab23d18c6c8
          token: ${{ secrets.REFACTORER_REPOSITORY_TOKEN }}
          path: private-source
          persist-credentials: false
          fetch-depth: 1

      - name: Record both credential outcomes
        if: always()
        env:
          OPENAI_OUTCOME: ${{ steps.openai.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
        shell: bash
        run: |
          python3 - <<'PY'
          from datetime import datetime, timezone
          import json, os, pathlib, subprocess
          evidence = pathlib.Path(os.environ['RUNNER_TEMP'], 'credential-probe-evidence')
          evidence.mkdir(exist_ok=True)
          source = pathlib.Path(os.environ['GITHUB_WORKSPACE'], 'private-source')
          observed = None
          if os.environ.get('CHECKOUT_OUTCOME') == 'success':
              process = subprocess.run(['git', '-C', str(source), 'rev-parse', 'HEAD'],
                  capture_output=True, text=True, timeout=10)
              if process.returncode == 0:
                  observed = process.stdout.strip()
          checkout_pass = (os.environ.get('CHECKOUT_OUTCOME') == 'success'
                           and observed == os.environ['REFACTORER_REVISION'])
          result = {'kind': 'goal30-credential-only-setup-result', 'probe_id': os.environ['PROBE_ID'],
              'recorded_at_utc': datetime.now(timezone.utc).isoformat(),
              'repository': os.environ['GITHUB_REPOSITORY'], 'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'probe_revision': os.environ['GITHUB_SHA'], 'reference_revision': os.environ['REFERENCE_REVISION'],
              'openai_step_outcome': os.environ.get('OPENAI_OUTCOME'),
              'checkout_step_outcome': os.environ.get('CHECKOUT_OUTCOME'),
              'expected_refactorer_revision': os.environ['REFACTORER_REVISION'],
              'observed_refactorer_revision': observed,
              'checkout_status': 'pass' if checkout_pass else 'fail-or-not-reached',
              'generation_requests': 0, 'measured_slot': None,
              'limitations': ['OpenAI read authentication/model visibility only; generation permission and quota untested',
                  'No candidate execution or candidate-isolation attestation']}
          (evidence / 'result.json').write_text(json.dumps(result, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Credential-only setup: OpenAI ' + str(result['openai_step_outcome'])
                            + '; pinned private checkout ' + result['checkout_status'] + '.\n')
          PY

      - name: Archive sanitized credential results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: credential-probe-${{ inputs.probe_id }}
          path: ${{ runner.temp }}/credential-probe-evidence/*.json
          retention-days: 7
          if-no-files-found: error

      - name: Require both credential checks to pass
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          evidence = pathlib.Path(os.environ['RUNNER_TEMP'], 'credential-probe-evidence')
          result = json.loads((evidence / 'result.json').read_text())
          if result['openai_step_outcome'] != 'success' or result['checkout_status'] != 'pass':
              raise SystemExit('Credential check failed; inspect the sanitized setup artifact')
          PY
